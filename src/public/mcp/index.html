<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Companion Hub - MCP</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold mb-8">Monitor and Control Panel</h1>
        
        <!-- System Metriken -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold mb-4">CPU & Memory</h2>
                <canvas id="resourceChart"></canvas>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold mb-4">API Aufrufe</h2>
                <canvas id="apiChart"></canvas>
            </div>
        </div>

        <!-- Logs & Fehler -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold mb-4">Letzte Logs</h2>
                <div id="logs" class="h-64 overflow-y-auto font-mono text-sm"></div>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold mb-4">Fehler</h2>
                <div id="errors" class="h-64 overflow-y-auto font-mono text-sm text-red-600"></div>
            </div>
        </div>

        <!-- Datei-Änderungen -->
        <div class="mt-8 bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">Datei-Änderungen</h2>
            <div id="fileChanges" class="h-32 overflow-y-auto font-mono text-sm"></div>
        </div>
    </div>

    <script>
        const ws = new WebSocket('ws://localhost:9001');
        const resourceCtx = document.getElementById('resourceChart').getContext('2d');
        const apiCtx = document.getElementById('apiChart').getContext('2d');
        
        // Charts initialisieren
        const resourceChart = new Chart(resourceCtx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'CPU Usage (%)',
                    data: [],
                    borderColor: 'rgb(75, 192, 192)',
                    tension: 0.1
                }, {
                    label: 'Memory Usage (%)',
                    data: [],
                    borderColor: 'rgb(255, 99, 132)',
                    tension: 0.1
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 100
                    }
                }
            }
        });

        const apiChart = new Chart(apiCtx, {
            type: 'bar',
            data: {
                labels: [],
                datasets: [{
                    label: 'API Aufrufe',
                    data: [],
                    backgroundColor: 'rgb(54, 162, 235)'
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });

        // WebSocket Event Handler
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            switch (data.type) {
                case 'metrics':
                    updateResourceCharts(data.data);
                    break;
                case 'error':
                    addError(data.data);
                    break;
                case 'fileChange':
                    addFileChange(data);
                    break;
                case 'apiCall':
                    updateApiChart(data.data);
                    break;
            }
        };

        function updateResourceCharts(metrics) {
            const timestamp = new Date(metrics.timestamp).toLocaleTimeString();
            
            resourceChart.data.labels.push(timestamp);
            resourceChart.data.datasets[0].data.push(metrics.cpu[0]);
            resourceChart.data.datasets[1].data.push(metrics.memory.usage);

            if (resourceChart.data.labels.length > 20) {
                resourceChart.data.labels.shift();
                resourceChart.data.datasets.forEach(dataset => dataset.data.shift());
            }

            resourceChart.update();
        }

        function addError(error) {
            const errorsDiv = document.getElementById('errors');
            const errorElement = document.createElement('div');
            errorElement.className = 'mb-2';
            errorElement.textContent = `${new Date().toLocaleTimeString()} - ${error.message}`;
            errorsDiv.prepend(errorElement);
        }

        function addFileChange(data) {
            const changesDiv = document.getElementById('fileChanges');
            const changeElement = document.createElement('div');
            changeElement.className = 'mb-2';
            changeElement.textContent = `${new Date(data.timestamp).toLocaleTimeString()} - ${data.path}`;
            changesDiv.prepend(changeElement);
        }

        function updateApiChart(apiCalls) {
            apiChart.data.labels = Object.keys(apiCalls);
            apiChart.data.datasets[0].data = Object.values(apiCalls);
            apiChart.update();
        }

        // Initial-Daten laden
        fetch('http://localhost:9000/metrics')
            .then(response => response.json())
            .then(data => {
                if (data.apiCalls) {
                    updateApiChart(data.apiCalls);
                }
            });

        fetch('http://localhost:9000/logs')
            .then(response => response.json())
            .then(logs => {
                const logsDiv = document.getElementById('logs');
                logs.forEach(log => {
                    const logElement = document.createElement('div');
                    logElement.className = 'mb-2';
                    logElement.textContent = `${new Date(log.timestamp).toLocaleTimeString()} - ${log.message}`;
                    logsDiv.appendChild(logElement);
                });
            });
    </script>
</body>
</html>
